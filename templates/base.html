<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Machine Learning{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0d2818; margin: 0; padding: 40px; color: #f4f4f4; box-sizing: border-box; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color:#163321; margin: -40px -40px 40px -40px; padding: 15px 40px;">
        <div class="container">
            <a class="navbar-brand" href="/" style="color:#D4A574; font-weight:bold;">Data with Roots</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">Machine Learning</a>
                        <ul class="dropdown-menu dropdown-menu-end" style="background-color:#1a3d2a;">
                            <li><a class="dropdown-item text-light" href="/concepts">Concepts</a></li>
                            <li><a class="dropdown-item text-light" href="/types">Types of Machine Learning</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><h6 class="dropdown-header text-light">Use Cases</h6></li>
                            <li><a class="dropdown-item text-light" href="/use-case-1">Use Case 1</a></li>
                            <li><a class="dropdown-item text-light" href="/use-case-2">Use Case 2</a></li>
                            <li><a class="dropdown-item text-light" href="/use-case-3">Use Case 3</a></li>
                            <li><a class="dropdown-item text-light" href="/use-case-4">Use Case 4</a></li>
                        </ul>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">Supervised</a>
                        <ul class="dropdown-menu dropdown-menu-end" style="background-color:#1a3d2a;">
                            <li><h6 class="dropdown-header text-light">Linear Regression</h6></li>
                            <li><a class="dropdown-item text-light" href="/linear-regression-concepts">Concepts</a></li>
                            <li><a class="dropdown-item text-light" href="/LinearRegression">Application</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    {% block content %}{% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
